<div class="container">
  <h1>Ma To-Do List</h1>

  <div class="input-group">
    <input
      type="text"
      [(ngModel)]="newTodo"
      (keyup.enter)="addTodo()"
      placeholder="Nouvelle tâche..."
    />
    <button (click)="addTodo()" [disabled]="!newTodo.trim()">Ajouter</button>
  </div>

  @if (total() > 0) {
    <p class="counter">
      {{ remaining() }} tâche(s) restante(s) sur {{ total() }}
    </p>
  }

  <ul class="todo-list">
    @for (todo of todos(); track todo.id) {
      <li [class.done]="todo.done">
        <div class="todo-content">
          <input
            type="checkbox"
            [checked]="todo.done"
            (change)="toggleTodo(todo.id)"
          />
          <span>{{ todo.text }}</span>
        </div>
        <button class="delete-btn" (click)="removeTodo(todo.id)">X</button>
      </li>
    } @empty {
      <li class="empty-state">Aucune tâche pour le moment. Ajoutez-en une !</li>
    }
  </ul>
</div>
